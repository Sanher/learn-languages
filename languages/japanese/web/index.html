<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Language Games Board</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="topbar card">
        <div class="top-left">
          <div class="label">Current language</div>
          <div class="value-row">
            <strong id="current-language">ja</strong>
            <button id="change-language-btn" class="ghost-btn">Change</button>
          </div>
          <div class="translation-row">
            <label for="secondary-translation-select" class="label">Secondary translation</label>
            <select id="secondary-translation-select" aria-label="Secondary translation">
              <option value="">Off</option>
              <option value="es">Español</option>
            </select>
            <small id="secondary-translation-status" class="muted"></small>
          </div>
        </div>
        <div class="top-right">
          <div class="label">Current level</div>
          <strong id="current-level">1</strong>
          <small id="level-rank-warning" class="level-rank-warning hidden"></small>
          <small id="today-score" class="muted">Today's score: 0</small>
          <div id="topbar-level-progress"></div>
        </div>
      </header>

      <section class="board">
        <section id="game-zone" class="card hidden"></section>
        <aside id="games-sidebar" class="card"></aside>
      </section>
    </main>

    <dialog id="raw-data-modal" class="raw-data-modal">
      <form method="dialog" class="raw-data-modal-card">
        <div class="raw-data-modal-head">
          <h2>Raw learner data</h2>
          <button id="raw-data-close-btn" type="button" class="ghost-btn">Close</button>
        </div>
        <p class="muted">This panel shows the current learner state, roadmap, stored progress, and review items.</p>
        <div class="raw-data-modal-actions">
          <button id="raw-data-refresh-btn" type="button" class="ghost-btn">Refresh raw data</button>
          <button id="raw-data-reset-btn" type="button" class="ghost-btn">Reset learner progress</button>
        </div>
        <pre id="raw-data-output">Loading...</pre>
      </form>
    </dialog>

    <script src="app.js" defer></script>
  </body>
</html>
